[package]
name = "oxidemc-webui"
version = "0.1.0"
edition = "2021"

[dependencies]
# reuse all the real server-management logic
oxidemc-core = { path = "../oxidemc-core" }

# web framework + async runtime
axum = { version = "0.7", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# process / host metrics that power the Monitor gauges
sysinfo = "0.32"

# errors, logging, misc
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
